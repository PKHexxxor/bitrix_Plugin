<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bedingte Felder für Bitrix24 - Installation</title>
    <script src="//api.bitrix24.com/api/v1/"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #2a3640; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bedingte Felder für Bitrix24</h1>
        <p>Die Anwendung wird installiert...</p>
        
        <div id="status"></div>
        
        <script>
            // App-Installation
            BX24.init(function() {
                document.getElementById('status').innerHTML = 
                    '<p class="success">Die Anwendung wurde erfolgreich installiert!</p>' +
                    '<p>Sie können jetzt das Fenster schließen und die Anwendung verwenden.</p>';
                
                // Installation abschließen
                BX24.installFinish();
            });
        </script>
    </div>
</body>
</html>
